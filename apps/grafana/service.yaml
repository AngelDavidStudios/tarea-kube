apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tarea-k8s
spec:
  type: NodePort
  selector:
    app: grafana
  sessionAffinity: ClientIP         # cada réplica tiene su propia base: el navegador se queda en la misma
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
