apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tarea-k8s
  labels:
    app: redis
spec:
  replicas: 1                       # caché: si el pod muere, el ReplicaSet crea otro (vacío)
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8.4-alpine
          args: ["--save", "", "--appendonly", "no"]   # sin persistencia: es caché
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
